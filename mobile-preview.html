<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>mobile preview</title>
<style>
  html,body{margin:0;background:#EDE8DC;font:12px/1.4 -apple-system,sans-serif;color:#6F6759}
  .wrap{padding:0;display:flex;flex-direction:column;align-items:center}
  iframe{width:390px;border:0;background:#FAF7F0;display:block}
</style></head>
<body><div class="wrap">
<iframe id="f" src="./intake.html" title="mobile preview"></iframe></div>
<script>
  var q = new URLSearchParams(location.search);
  var h = q.get("h") || "844";
  var f = document.getElementById("f");
  f.style.height = h + "px";
  f.addEventListener("load", function(){
    try {
      var d = f.contentDocument;
      var st = d.createElement("style");
      st.textContent = "html{scrollbar-width:none}html::-webkit-scrollbar{display:none}";
      d.head.appendChild(st);
    } catch(e){}
  });
</script>
</body></html>
